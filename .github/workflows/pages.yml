# site/ 폴더를 GitHub Pages로 공개 (main에 올라갈 때마다)
name: Pages
on:
  push:
    branches: [main]
    paths: ["site/**", "*.py", "analysis/**", "tests/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 규칙 테스트 + 점검 결과가 site/data.js 와 같은지
        run: |
          python -m unittest discover -s tests
          cp site/data.js /tmp/data.js.before
          python check.py
          cmp site/data.js /tmp/data.js.before
          cp out/parking2025.json /tmp/p25.before && python parking2025.py > /dev/null && cmp out/parking2025.json /tmp/p25.before
          cp site/courses.js /tmp/courses.js.before
          python courses.py > /dev/null
          cmp site/courses.js /tmp/courses.js.before
          cp site/gap.js /tmp/gap.js.before
          python gap.py > /dev/null
          cmp site/gap.js /tmp/gap.js.before
          cp site/analysis.js /tmp/analysis.js.before
          python analysis/run.py > /dev/null
          cmp site/analysis.js /tmp/analysis.js.before
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: { path: site }
      # 올린 직후엔 배포 쪽에서 아티팩트가 안 보일 때가 있어 잠깐 기다림
      - run: sleep 20
      - id: d
        uses: actions/deploy-pages@v4
