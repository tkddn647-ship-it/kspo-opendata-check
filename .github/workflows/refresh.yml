# 매주 월요일 아침: 공공데이터포털의 강좌 파일 5종이 바뀌었는지 보고, 바뀌었으면 받아서 화면을 다시 만든다.
name: 강좌 자료 갱신
on:
  schedule:
    - cron: "17 21 * * 0"   # 한국 시각 월요일 06:17
  workflow_dispatch:
    inputs:
      force:
        description: "수정일이 같아도 받기"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 포털 확인·내려받기
        id: r
        run: |
          set +e
          if [ "${{ inputs.force }}" = "true" ]; then python tools/refresh_courses.py --force; else python tools/refresh_courses.py; fi; code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "1" ]; then echo "::warning::포털 확인 실패 — 기존 자료 유지"; fi
          exit 0
      - name: 화면 다시 만들기·테스트
        if: steps.r.outputs.code != '1'
        run: |
          python courses.py > /dev/null
          python gap.py > /dev/null
          python fit.py > /dev/null
          python check.py > /dev/null
          python analysis/run.py > /dev/null
          python -m unittest discover -s tests
      - name: 올리고 배포
        if: steps.r.outputs.code != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw site out
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -qm "강좌 자료 자동 확인 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push -q
          gh workflow run pages.yml --ref main
